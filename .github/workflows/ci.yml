name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: git ls-files -z '*.h' '*.cpp' | xargs -0 clang-format --dry-run --Werror

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full build
            preset: dev
            desktop: ON
          - name: Core only (no Qt)
            preset: dev
            desktop: OFF
          - name: ASan + UBSan
            preset: asan
            desktop: OFF
          - name: Fuzzers (60 s each)
            preset: fuzz
            desktop: OFF
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.preset }}-desktop-${{ matrix.desktop }}

      - name: Install clang
        if: matrix.preset == 'fuzz'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Install Qt
        if: matrix.desktop == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl-dev

      - name: Set up vcpkg at the manifest baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DBUILD_DESKTOP=${{ matrix.desktop }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run clang-tidy
        if: matrix.name == 'Core only (no Qt)'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          git ls-files -z 'core/src/*.cpp' | xargs -0 -P4 -n1 clang-tidy -p build/dev --quiet

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: matrix.preset != 'fuzz'
        run: ctest --preset ${{ matrix.preset }}

      - name: Fuzz
        if: matrix.preset == 'fuzz'
        run: |
          mkdir -p build/fuzz/artifacts build/fuzz/corpus_parser build/fuzz/corpus_op
          build/fuzz/core/fuzz/fuzz_parser -max_total_time=60 -dict=core/fuzz/svg.dict \
            -artifact_prefix=build/fuzz/artifacts/ build/fuzz/corpus_parser core/tests/fixtures
          build/fuzz/core/fuzz/fuzz_op_json -max_total_time=60 -dict=core/fuzz/op_json.dict \
            -artifact_prefix=build/fuzz/artifacts/ build/fuzz/corpus_op core/tests/fixtures/ops

      - name: Keep the inputs that crashed
        if: failure() && matrix.preset == 'fuzz'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/
