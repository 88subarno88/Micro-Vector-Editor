name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: git ls-files -z '*.h' '*.cpp' | xargs -0 clang-format --dry-run --Werror

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@2.67.1 lint server/openapi.yaml

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full build
            preset: dev
            desktop: ON
          - name: Core only (no Qt)
            preset: dev
            desktop: OFF
          - name: Server
            preset: server
            desktop: OFF
            server: true
          - name: Server under TSan
            preset: tsan
            desktop: OFF
            server: true
          - name: ASan + UBSan
            preset: asan
            desktop: OFF
          - name: Fuzzers (60 s each)
            preset: fuzz
            desktop: OFF
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          # Per preset: jobs sharing one key would race to save it, and only one job's packages would be kept.
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/*') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.preset }}-desktop-${{ matrix.desktop }}

      - name: Install clang
        if: matrix.preset == 'fuzz'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Install server build tools
        if: matrix.server
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex autoconf autoconf-archive automake libtool

      - name: Install Qt
        if: matrix.desktop == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl-dev

      # TSan can't map its shadow memory with the address randomisation the runner's kernel uses, and
      # libpq's build runs programs built with TSan too.
      - name: Let ThreadSanitizer run
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up vcpkg at the manifest baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DBUILD_DESKTOP=${{ matrix.desktop }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run clang-tidy
        if: matrix.name == 'Core only (no Qt)'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          git ls-files -z 'core/src/*.cpp' | xargs -0 -P4 -n1 clang-tidy -p build/dev --quiet

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Start the databases and migrate the test one
        if: matrix.server
        run: |
          docker compose -f deploy/docker-compose.dev.yml up -d --wait
          curl -fsSL -o dbmate https://github.com/amacneil/dbmate/releases/download/v2.37.0/dbmate-linux-amd64
          echo "f855e99a0f0a81322014bf686b1cb820d2b4d8074e4eadafd64b851b80ecb15a  dbmate" | sha256sum -c -
          chmod +x dbmate
          grep -E '^[A-Z_]+=' deploy/dev.env >> "$GITHUB_ENV"
          set -a; source deploy/dev.env; set +a
          ./dbmate -e TEST_DATABASE_URL up

      - name: Test
        if: matrix.preset != 'fuzz'
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} | tee ctest.log
          # A missing setting would otherwise pass quietly, with every database test skipped.
          if grep -q '(Skipped)' ctest.log; then
            echo "::error::tests were skipped; is TEST_DATABASE_URL set?"
            exit 1
          fi

      - name: Fuzz
        if: matrix.preset == 'fuzz'
        run: |
          mkdir -p build/fuzz/artifacts build/fuzz/corpus_parser build/fuzz/corpus_op
          build/fuzz/core/fuzz/fuzz_parser -max_total_time=60 -dict=core/fuzz/svg.dict \
            -artifact_prefix=build/fuzz/artifacts/ build/fuzz/corpus_parser core/tests/fixtures
          build/fuzz/core/fuzz/fuzz_op_json -max_total_time=60 -dict=core/fuzz/op_json.dict \
            -artifact_prefix=build/fuzz/artifacts/ build/fuzz/corpus_op core/tests/fixtures/ops

      - name: Keep the inputs that crashed
        if: failure() && matrix.preset == 'fuzz'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/

  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.13
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-wasm-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-wasm-

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Set up Emscripten
        run: |
          [ -d ~/emsdk ] || git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Set up vcpkg at the manifest baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset wasm
          cmake --build --preset wasm --parallel

      # Emscripten's own Node runs the module as the browser will: loading it, calling through embind, and
      # catching exceptions inside WebAssembly.
      - name: Test the module
        run: |
          source ~/emsdk/emsdk_env.sh
          VEC_WASM_DIR=build/wasm node --test core/wasm/vec.test.mjs

      - name: Keep the module for the web client
        uses: actions/upload-artifact@v4
        with:
          name: vec-wasm
          path: |
            build/wasm/vec.js
            build/wasm/vec.wasm
            build/wasm/vec.d.ts
          if-no-files-found: error

  web:
    name: Web client
    needs: wasm # the client imports the core's types, and its tests run on the core itself
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Get the WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: vec-wasm
          path: web/src/wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npx tsc -b

      - name: Test
        shell: bash
        run: |
          npm test | tee test.log
          # The tests on the real core skip themselves without it, which would otherwise pass quietly.
          if grep -q 'skipped' test.log; then
            echo "::error::tests were skipped; did the WebAssembly core reach src/wasm?"
            exit 1
          fi

  e2e:
    name: End to end
    # The images that ship, built and started with deploy/docker-compose.yml: nginx, two API servers, the
    # worker, Postgres and Redis. Testing these, not binaries from another job, is what would have caught a
    # compiler that only the images use (BLD-15).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Every test signs its users in, all from one address: far more than the usual auth limit allows.
      - name: Settings
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "WEB_PORT=8000"
            echo "AUTH_REQUESTS_PER_MINUTE=10000"
          } > deploy/.env

      - name: Build and start everything
        run: make up

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: E2E_BASE_URL=http://localhost:8000 npx playwright test

      - name: Collect the services' logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color > services.log

      - name: Keep the report and the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
            services.log
