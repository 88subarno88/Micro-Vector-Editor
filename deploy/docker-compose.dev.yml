# Local development only. The credentials are throwaway, and ports are bound to localhost.
name: vec-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vec
      POSTGRES_PASSWORD: vec
      POSTGRES_DB: vec
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vec -d vec"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Only with --profile scale: listens on 127.0.0.1:8080 and balances across two vec_api processes
  # started on the host with PORT=8081 and PORT=8082. Host networking lets it reach them.
  nginx:
    image: nginx:1.27
    profiles: [scale]
    network_mode: host
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
