# Two API instances behind one address, for trying horizontal scaling locally. Requests and WebSocket
# connections are spread round-robin (no ip_hash), so two clients of one document usually land on
# different instances and rely on Redis to see each other's edits.
events {}

http {
    upstream api {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 127.0.0.1:8080;
        client_max_body_size 1m;  # the API's own limit

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Longer than the server's 45 s heartbeat, so nginx never closes a live WebSocket first.
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
