# The web app's own files, and the API behind it on the same address: /api and the document WebSockets go
# to two API servers, round-robin. The two need not agree on anything but the database and Redis, which
# keep every instance's rooms in step (see server/api/collab/DocSocket.h).
upstream api {
    server api-1:8080;
    server api-2:8080;
}

# A WebSocket upgrade passes the Upgrade header on; anything else closes the upstream connection as usual.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    # Behind the Cloudflare tunnel (`make share`) every visitor arrives from the tunnel's container, and
    # Cloudflare says who they really are in CF-Connecting-IP. Believed only from Docker's private
    # addresses, where the tunnel is; it then becomes the X-Real-IP passed to the API, for its rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    root /usr/share/nginx/html;
    client_max_body_size 1m; # the API's own limit

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Longer than the server's 45 s heartbeat, so nginx never closes a live connection first.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Vite names its files by their contents, so they can be kept forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the app, which routes in the browser: /docs/123 is index.html too. Never cached, so
    # a new release is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri /index.html;
    }
}
